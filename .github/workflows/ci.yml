name: CI

# Every push is checked, on every branch.
#
# Restricting this to `main` meant a branch pushed without a PR was verified by
# nobody, while reading as finished from the branch you were standing on - clean
# tree, in sync with its remote, green locally. That has now happened here three
# times in different forms, so the trigger is the thing to fix rather than the
# discipline.
#
# Tags are excluded: they point at commits that were already checked when pushed.
on:
  push:
    tags-ignore: ['**']
  pull_request:

# A superseded run has nothing useful left to say. Cancel it.
#
# Grouping by head ref rather than by `github.ref` is deliberate: a push and the
# pull_request event for the same branch would otherwise land in different groups
# and both run. Sharing a group means the pull_request run - which tests the
# merge result, not just the branch tip, and is therefore the more useful of the
# two - supersedes the push run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: fails on a lockfile that disagrees
      # with package.json instead of quietly resolving something else.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The engine is headless by contract, so the whole suite runs here with no
      # browser and no display. That includes the parts that matter most:
      #
      #   - the analytic oracle, against closed-form queueing theory
      #   - the DES oracle, against a token-level simulation
      #   - shuffled-input identity, which is what actually protects determinism
      #   - the Act I reference numbers
      #   - a performance guard, which once caught a quadratic pooling bug
      #
      # If this job passes, the numbers the game grades on are reproducible.
      - name: Test
        run: npm test
